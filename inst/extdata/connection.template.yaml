# Copy to ~/.config/metabo-figures/connection.yaml (or to the repository
# root as `connection.yaml`, gitignored, for a local override).
#
# See docs/CONFIGURATION.md for the schema and docs/DB_ACCESS.md for the
# backends. As of 2026-11, dev5 (port 5405 on beauty) is the only
# deployment with data; dev3 and dev4 are empty.

default_deployment: dev5

# Optional routing per panel, e.g.
#   ramp-comparison:
#     default: dev5
overrides: {}

credentials_source: env      # env | file | pgpass
credentials_path: null       # required when credentials_source == "file"
