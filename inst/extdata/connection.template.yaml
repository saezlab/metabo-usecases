# Copy to ~/.config/metabo-figures/connection.yaml (or to project root as
# `connection.yaml` — gitignored — for project-local override).
#
# See CONFIGURATION.md for the full schema.
#
# The 2026-06-14 dev5 integrated-build promotion collapsed the previous
# (2026-06-09) per-panel deployment matrix into a single-deployment
# regime:
#   dev5 (port 5405, integrated build — gene-centric entities + stored
#         labels including Goslin lipid names + chemical-fallback
#         resolution + RDKit-derived structural specificity +
#         RaMP-conflict tables + cycle-001 derived family) is the only
#         deployment in the active rotation; every panel routes here.
#   dev3 (5403) and dev4 (5404) remain valid in the deployment enum for
#         historical-sidecar compatibility but the registry does not
#         route any current panel to them.
#   prod / dev2 are excluded from the active rotation (opt-in only).

default_deployment: dev5

# overrides: (none needed — every panel routes to the default
# post-2026-06-14; the per-panel split is retired.)
overrides: {}

credentials_source: env      # env | file | pgpass
credentials_path: null       # required when credentials_source == "file"
