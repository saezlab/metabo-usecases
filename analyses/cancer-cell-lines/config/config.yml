# Configuration of the cancer cell lines use case.
# Paths are relative to the repository root and resolved with here::here().

paths:
  raw: data/raw/cancer-cell-lines
  # versioned processed dataset; bump the version when processing changes
  derived: data/derived/cancer-cell-lines/shorthouse_v1
  # QC tables, plots and rendered reports (gitignored)
  output: analyses/cancer-cell-lines/output

shorthouse:
  files:
    injections: msb202211006-sup-0002-datasetev1.xlsx   # Dataset EV1
    ions: msb202211006-sup-0003-datasetev2.xlsx         # Dataset EV2
    intensities: msb202211006-sup-0004-datasetev3.xlsx  # Dataset EV3
  # Lines removed entirely. MCF7 was a QC line (64 injections) and was removed
  # by Shorthouse et al. 2022 because its many repeats biased the data.
  exclude_lines: [MCF7]
  # Additional cultures of the same cell line, merged into one line
  # (Shorthouse et al. count these as one line; same Cellosaurus ID in EV1).
  merge_lines:
    CORL88B: CORL88A
    MDAMB231B: MDAMB231
    NCIH441B: NCIH441
  # Culture batch per injection from the authors' GitHub repository
  # (shorthouse-mrc/CellLine_Metabolomics @ cce3b15; local only, no licence;
  # decisions D8, D11)
  batch_mapping: shorthouse_github/Cellline_mappings_shorthouse.csv
  # Ions whose HMDB/KEGG annotation duplicates an earlier ion (different m/z,
  # same metabolite); kept from the original pipeline, see preprocessing_changes.md
  drop_duplicate_annotation_ions: true

analysis:
  # Lines kept in the pre-processing output but excluded from all analyses
  exclude_lines:
    184A1: non-malignant mammary epithelial line, not a cancer line (decision Checkpoint 1b, 2026-10-28)

landscape:
  # mutation landscape (analysis/02): genes shown and tested
  n_top_genes: 30          # genes in the oncoprint-style overview
  min_altered_lines: 8     # minimum altered lines (all tissues) for a gene to be tested

contrast:
  # contrast selection (analysis/03); defaults of open question Q2, to be confirmed at Checkpoint 2
  min_per_group_per_tissue: 2   # mutant and wild-type lines a tissue needs to contribute
  min_mutant_total: 8           # effective mutant lines (contributing tissues) to rank a candidate
  # genes considered in addition to those tested in analysis/02 (planning, positive controls)
  extra_genes: [EGFR, KEAP1, NFE2L2, IDH1, IDH2, MTAP]
  seed: 2026                    # simulated Fisher p-values for batch balance
  # Definition of "mutated" by gene role (decision Q1, Checkpoint 2, 2026-10-29)
  oncogenes: [KRAS, NRAS, BRAF, PIK3CA, EGFR, NFE2L2]                 # likely-driver variant
  tumour_suppressors: [TP53, STK11, KEAP1, SMARCA4, CDKN2A, PTEN, RB1] # any protein-changing variant or homozygous deletion
  # Pathway-level groups (decision Q3): line counts as altered if any member gene is
  pathway_groups:
    NRF2: [KEAP1, NFE2L2]
  # Genes whose status rests on copy number alone: lines without DepMap copy number are
  # left out for them (D25). For tumour suppressors, lines without copy number count as
  # not deleted (homozygous deletion of KEAP1/STK11/TP53 in 1-2 of 137 lines, audit/08).
  deletion_genes: [MTAP]

differential:
  # contrasts chosen at Checkpoint 2 (2026-10-29); the main contrast follows after the positive control
  contrasts:
    nrf2_lung:
      description: NRF2 activation (KEAP1 or NFE2L2 altered) vs not, lung lines (positive control)
      group: NRF2
      tissues: [Lung]
      covariates: [KRAS, STK11, TP53]
      # expected readouts, fixed before the fit (Shorthouse et al. 2022, Appendix Fig S6;
      # Okazaki et al. 2020, doi:10.1007/s12551-020-00659-8); ions matched by name
      readouts:
        - {pattern: "glutathione", direction: up}        # NRF2 drives glutathione synthesis
        - {pattern: "^L-Glutamic_acid", direction: down} # ... which consumes intracellular glutamate
    kras:
      description: KRAS mutant vs wild type, tissue as blocking factor (main contrast)
      group: KRAS
      tissues: contributing        # tissues with >= min_per_group_per_tissue in both groups
      covariates: [TP53, STK11, KEAP1]
    mtap_deletion:
      description: MTAP homozygous deletion vs not, tissue as blocking factor (main contrast; 9p21 loss with CDKN2A)
      group: MTAP
      tissues: contributing
      covariates: [TP53]
    stk11_lung:
      description: STK11 altered vs not, lung lines (main contrast)
      group: STK11
      tissues: [Lung]
      covariates: [KRAS, KEAP1, TP53]
  # exploratory screen of all eligible genes (decision D22): same standard model for every gene,
  # results labelled hypothesis-generating and compared with Dataset EV4 of Shorthouse et al.
  screen:
    standard_covariates: [TP53]    # TP53 itself is tested without TP53 as covariate
    tissues: contributing

tissue:
  # Rule-based labels (step 02) renamed to the 11 tissues of Shorthouse et al. 2022
  rename:
    Lung/Pleura: Lung
    Urinary bladder: Bladder
  # Lines where the rules give a different label than Shorthouse et al.
  # (decision and evidence: audit/03_tissue_and_overlaps.Rmd)
  overrides:
    M14:
      tissue: Skin
      reason: amelanotic melanoma; a second disease annotation (pleural) wins under the rule order
    PC3:
      tissue: Prostate
      reason: prostate carcinoma; a second disease annotation (lung) wins under the rule order
    MDAMB436:
      tissue: Breast
      reason: breast carcinoma derived from a pleural effusion; rules fall back to the sampling site
    T47D:
      tissue: Breast
      reason: breast carcinoma derived from a pleural effusion; rules fall back to the sampling site
    RPMI8826:
      tissue: Blood
      reason: plasma cell myeloma; haematological lines are grouped as Blood in Shorthouse et al.
    184A1:
      tissue: Unknown
      reason: non-malignant mammary epithelial line; Unknown in Shorthouse et al.
    NCIH460DNP53:
      tissue: Unknown
      reason: engineered derivative without annotation in EV1; Unknown in Shorthouse et al.
    SR8714:
      tissue: Unknown
      reason: identity not confirmed by EV1; Unknown in Shorthouse et al.

depmap:
  # source of mutation and copy-number status (decision: audit/04_mutation_sources.Rmd);
  # local only, see data/raw/cancer-cell-lines/README.md
  release: "24Q4 Public"
  doi: 10.25452/figshare.plus.27993248.v1
  dir: depmap_24Q4

cellosaurus:
  # local flat file with the first 57 header lines removed (see data/raw README)
  file: cellosaurus.txt
  release: "53.0"
  # Names without an accession in EV1 (RRID) and without a Cellosaurus ID in
  # EV1. Accessions are resolved first from RRID, then from the EV1 ID field.
  manual_accessions:
    NCIH460DNP53:
      accession: CVCL_0459   # parental NCI-H460
      note: engineered derivative (dominant-negative TP53); parental mutations do not apply
      engineered: true
    SR8714:
      accession: CVCL_1711   # SR
      note: mapping from the original pipeline, not confirmed by EV1; tissue Unknown in Shorthouse et al.
      engineered: false
