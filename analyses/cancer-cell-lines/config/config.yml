# Configuration of the cancer cell lines use case.
# Paths are relative to the repository root and resolved with here::here().

paths:
  raw: data/raw/cancer-cell-lines
  # versioned processed dataset; bump the version when processing changes
  derived: data/derived/cancer-cell-lines/shorthouse_v1
  # QC tables, plots and rendered reports (gitignored)
  output: analyses/cancer-cell-lines/output

shorthouse:
  files:
    injections: msb202211006-sup-0002-datasetev1.xlsx   # Dataset EV1
    ions: msb202211006-sup-0003-datasetev2.xlsx         # Dataset EV2
    intensities: msb202211006-sup-0004-datasetev3.xlsx  # Dataset EV3
  # Lines removed entirely. MCF7 was a QC line (64 injections) and was removed
  # by Shorthouse et al. 2022 because its many repeats biased the data.
  exclude_lines: [MCF7]
  # Additional cultures of the same cell line, merged into one line
  # (Shorthouse et al. count these as one line; same Cellosaurus ID in EV1).
  merge_lines:
    CORL88B: CORL88A
    MDAMB231B: MDAMB231
    NCIH441B: NCIH441
  # Ions whose HMDB/KEGG annotation duplicates an earlier ion (different m/z,
  # same metabolite); kept from the original pipeline, see preprocessing_changes.md
  drop_duplicate_annotation_ions: true

tissue:
  # Rule-based labels (step 02) renamed to the 11 tissues of Shorthouse et al. 2022
  rename:
    Lung/Pleura: Lung
    Urinary bladder: Bladder
  # Lines where the rules give a different label than Shorthouse et al.
  # (decision and evidence: audit/03_tissue_and_overlaps.Rmd)
  overrides:
    M14:
      tissue: Skin
      reason: amelanotic melanoma; a second disease annotation (pleural) wins under the rule order
    PC3:
      tissue: Prostate
      reason: prostate carcinoma; a second disease annotation (lung) wins under the rule order
    MDAMB436:
      tissue: Breast
      reason: breast carcinoma derived from a pleural effusion; rules fall back to the sampling site
    T47D:
      tissue: Breast
      reason: breast carcinoma derived from a pleural effusion; rules fall back to the sampling site
    RPMI8826:
      tissue: Blood
      reason: plasma cell myeloma; haematological lines are grouped as Blood in Shorthouse et al.
    184A1:
      tissue: Unknown
      reason: non-malignant mammary epithelial line; Unknown in Shorthouse et al.
    NCIH460DNP53:
      tissue: Unknown
      reason: engineered derivative without annotation in EV1; Unknown in Shorthouse et al.
    SR8714:
      tissue: Unknown
      reason: identity not confirmed by EV1; Unknown in Shorthouse et al.

cellosaurus:
  # local flat file with the first 57 header lines removed (see data/raw README)
  file: cellosaurus.txt
  release: "53.0"
  # Names without an accession in EV1 (RRID) and without a Cellosaurus ID in
  # EV1. Accessions are resolved first from RRID, then from the EV1 ID field.
  manual_accessions:
    NCIH460DNP53:
      accession: CVCL_0459   # parental NCI-H460
      note: engineered derivative (dominant-negative TP53); parental mutations do not apply
      engineered: true
    SR8714:
      accession: CVCL_1711   # SR
      note: mapping from the original pipeline, not confirmed by EV1; tissue Unknown in Shorthouse et al.
      engineered: false
