# FR-039: configurable panel-selection config for Figure 1 composite.
# Lists the variant artifact identifiers that appear in the final composite,
# in display order. Panel A (manual architecture asset) is always placed first
# by compose_fig01.tex via \includegraphics; the quantitative panels follow.
# Every generated variant listed or not listed here is always emitted as a
# stand-alone artifact under out/ (FR-007g, FR-009d).
#
# Change this file to swap panels without touching any figure script.
# The composite rebuild reads this config; caption.tex (a)/(b)/... letters
# must match the count declared here (FR-041b).

figure: fig01-overview

# Panel A is the vendored manual architecture asset (FR-005b) — always included
# at slot 0; not listed here as it is injected by the LaTeX template.
manual_panel_a: inst/extdata/manual/architecture/omnipath-architecture-new2026.pdf

panels:
  # Position B: faceted resource overview (FR-007a)
  - id: faceted_resource_overview
    file: fr007a-overview.pdf
    label: B

  # Position C: coverage profiles (FR-007b) - placeholder until renderer lands
  # - id: coverage_profiles
  #   file: panelB.pdf
  #   label: C

  # Position C: resource-overlap networks (FR-007c)
  - id: resource_overlap_networks
    file: panelC.pdf
    label: C

  # Position D: entity × interaction-type matrix (FR-007d)
  - id: entity_interaction_matrix
    file: panelD.pdf
    label: D

  # Position E: structural specificity × chemical category (FR-007e, dev4)
  - id: structural_specificity
    file: panelE.pdf
    label: E

  # Position F: ontology terms (FR-007a Associations facet)
  - id: ontology_terms
    file: panelF.pdf
    label: F

  # Position G: RaMP InChIKey-conflict analysis (FR-007f, dev4)
  - id: ramp_comparison
    file: panelG.pdf
    label: G
