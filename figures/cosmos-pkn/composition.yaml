# FR-039: per-figure composition config for Figure 5
# Composite (post-2026-06-18 merge): regulation-types schematic (A) + three
# COSMOS+ data panels — comparison (B), compartments (C), resources (D).
# The MetaLinksDB panel and the two un-vendored schematics are produced as
# standalone artifacts and are NOT part of the composite (selected: false).

figure_id: cosmos-pkn
title: "COSMOS+ prior-knowledge network — regulation-type schematic, scope comparison, compartment coverage, and resource contributions"

panels:
  - id: regulation_types
    label: "A"
    mode: manual
    path: "manual/regulation-types"
    selected: true
    description: "Regulation-type legend schematic — full-width top panel (FR-011, embedded)"

  - id: panel_comparison
    label: "B"
    mode: pipeline
    renderer: cosmos_comparison_panel
    selected: true
    description: "Species-aware comparison of old COSMOS PKN vs. COSMOS+ by interaction type (FR-011a)"

  - id: panel_compartment
    label: "C"
    mode: pipeline
    renderer: cosmos_compartment_panel
    selected: true
    description: "COSMOS+ interactions per annotated subcellular compartment (FR-011b)"

  - id: panel_resource
    label: "D"
    mode: pipeline
    renderer: cosmos_resource_contribution_panel
    selected: true
    description: "Entity and interaction counts per contributing resource in COSMOS+ (FR-011c; by_resource_split, dodged)"

# Standalone artifacts — rendered but NOT composited (selected: false).
standalone:
  - id: panel_metalinks
    mode: pipeline
    renderer: metalinks_cosmos_panel
    selected: false
    description: "MetaLinksDB 2.0 vs. COSMOS+ comparison by interaction type (FR-011d; standalone)"

  - id: pkn_to_binary
    mode: manual
    path: "manual/pkn-to-binary-network"
    selected: false
    description: "Schematic: signed directed network collapsed to a binary signed PKN (deferred, not vendored)"

  - id: moon_inference
    mode: manual
    path: "manual/moon-activity-inference"
    selected: false
    description: "MOON recursive-activity-inference schematic (deferred, not vendored)"

layout:
  # schematic A full width on top; B | C | D data panels in one row beneath.
  # Set active_composite = 'comparison_fullwidth' in build.R to put B full
  # width under the schematic with C | D as a bottom row instead.
  active_composite: schematic_bcd_row
  data_row_ncol: 3
  composite_width_mm: 180
  composite_height_mm: 200
