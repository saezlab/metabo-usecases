# FR-039: per-figure composition config for Figure 4
# All seven slots are fixed — no deferred panel selection for Figure 4.

figure_id: fig04-cosmos-pkn
title: "COSMOS+ prior-knowledge network — scope extension, compartment coverage, resource contributions, and comparison with MetaLinksDB 2.0"

panels:
  - id: panel_a
    label: "A"
    mode: pipeline
    renderer: fig04_cosmos_comparison_panel
    selected: true
    description: "Species-aware comparison of old COSMOS PKN vs. COSMOS+ by interaction type (FR-011a)"

  - id: panel_b
    label: "B"
    mode: pipeline
    renderer: fig04_compartment_panel
    selected: true
    description: "COSMOS+ interactions per annotated subcellular compartment (FR-011b)"

  - id: panel_c
    label: "C"
    mode: pipeline
    renderer: fig04_resource_contribution_panel
    selected: true
    description: "Entity and interaction counts per contributing resource in COSMOS+ (FR-011c)"

  - id: panel_d
    label: "D"
    mode: pipeline
    renderer: fig04_metalinks_cosmos_panel
    selected: true
    description: "MetaLinksDB 2.0 vs. COSMOS+ comparison by interaction type (FR-011d)"

schematics:
  - id: pkn_to_binary
    label: "S1"
    mode: manual
    path: "manual/pkn-to-binary-network"
    selected: true
    description: "Schematic: how the signed directed OmniPath Metabo network is collapsed to a binary signed PKN"

  - id: regulation_types
    label: "S2"
    mode: manual
    path: "manual/regulation-types"
    selected: true
    description: "Regulation-type legend schematic"

  - id: moon_inference
    label: "S3"
    mode: manual
    path: "manual/moon-activity-inference"
    selected: true
    description: "MOON recursive-activity-inference schematic"

layout:
  ncol: 2
  panel_width_mm: 120
  panel_height_mm: 90
